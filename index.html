<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c291f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Biathlon EPS</title>
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css?v=35">
<script type="module" src="./app.js?v=35"></script>
</head>
<body>
<header><div class="top"><a href="./" class="brand"><img src="./icon-192.png" alt=""><span>BIATHLON <b>EPS</b></span></a><details class="backup-menu" id="backup-menu">
  <summary>Sauvegarde</summary>
  <div class="backup-menu-body">
    <p>Classes, séances et résultats de cet appareil.</p>
    <button type="button" data-export="backup">Sauvegarder toutes les données</button>
    <form id="backup-form">
      <label>Fichier de sauvegarde<input type="file" name="file" accept=".json,application/json" required></label>
      <button type="submit" class="primary">Restaurer la sauvegarde</button>
    </form>
  </div>
</details></div></header>
<main>
<nav aria-label="Sections"><button data-view="classes">Classes</button><button data-view="sessions">Séances</button><button data-view="entry">Évaluation</button></nav>
<div id="status" role="status"></div>
<div id="screen"></div>
</main>
</body></html>
